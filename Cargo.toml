[package]
name = "$NAME"
version = "0.1.0"
edition = "2024"

[dependencies]

# Uncomment the following lines to enable often used dependencies

# Rusty Toolbox
# athena = { git = "https://github.com/xqhare/athena.git" }

# XffValue only (no dependencies)
# aequa = { git = "https://github.com/xqhare/aequa.git" }

# Serde for XffValue (Nabu and Mawo reexport `XffValue`)
# Working with `.xff` files
# nabu = { git = "https://github.com/xqhare/nabu.git" }
# Working with `.json` or `.csv` files
# mawu = { git = "https://github.com/xqhare/mawu.git" }

# CSRNG
# tyche = { git = "https://github.com/xqhare/tyche.git" }

# Create valid paths and hidden directories
# areia = { git = "https://github.com/xqhare/areia.git" }

# Time and date library (easily integrates with `XffValue`)
# horae = { git = "https://github.com/xqhare/horae.git" }

# Signal-handling library 
# hades = { git = "https://github.com/xqhare/hades.git" }

# TUI
# talos = { git = "https://github.com/xqhare/talos.git" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
